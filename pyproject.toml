[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coreml-converter"
version = "0.1.0"
description = "Convert Stable Diffusion models + LoRAs to CoreML for Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25",
    "huggingface-hub>=0.20",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
# The conversion environment is pinned, not ranged. Apple's
# python_coreml_stable_diffusion (installed separately by `ccml start`, since
# its own metadata pins an unbuildable numpy<1.24) imports diffusers,
# transformers and diffusionkit at module scope and only works against the
# versions it was released with — resolving these ranges to "latest" yields a
# torch2coreml that cannot be imported. torch is pinned to the version
# coremltools states it was tested against.
ml = [
    "torch==2.7.0",
    "numpy<2.0",
    "scipy<1.14",
    "scikit-learn<1.6",
    "diffusers==0.30.2",
    "transformers==4.44.2",
    "huggingface-hub==0.24.6",
    "safetensors>=0.4",
    "coremltools>=8.0,<10",
    "diffusionkit==0.4.0",
    # diffusers routes load_lora_weights/fuse_lora through PEFT; without it
    # every LoRA merge fails with "PEFT backend is required for this method."
    "peft==0.13.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx",
    "respx>=0.20",
]

[project.scripts]
coreml-converter = "coreml_converter.cli.main:cli"
ccml = "coreml_converter.cli.main:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/coreml_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
